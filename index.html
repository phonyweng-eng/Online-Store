<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickMart Convenience Store</title>
    
    <style>
    /* Global Styles */
    body {
        font-family: Arial, sans-serif;
        margin: 0;
        background: #f5f5f5;
    }

    header {
        background: #0a7a3d;
        color: white;
        padding: 20px;
        text-align: center;
        position: relative;
    }

    .logout-btn {
        position: absolute;
        right: 20px;
        top: 30px;
        background: #f5f5f5;
        color: #0a7a3d;
        font-weight: bold;
    }
    .logout-btn:hover {
        background: #e0e0e0;
    }

    /* Auth Containers (Login & Register) */
    .auth-container {
        max-width: 400px;
        margin: 80px auto;
        background: white;
        padding: 30px;
        border-radius: 10px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        text-align: center;
    }

    .auth-container h2 {
        color: #0a7a3d;
        margin-bottom: 20px;
    }

    .auth-container p {
        margin-top: 15px;
        font-size: 14px;
        color: #666;
    }

    .auth-container a {
        color: #0a7a3d;
        text-decoration: none;
        font-weight: bold;
    }

    /* Store Grid Layout */
    .store-layout {
        display: none; /* Hidden by default until login */
    }

    .products {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 20px;
        padding: 30px;
        margin-right: 300px; 
    }

    .product {
        background: white;
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        text-align: center;
    }

    .product-img {
        width: 100%;
        height: 150px;
        object-fit: cover;
        border-radius: 8px;
        margin-bottom: 10px;
        background: #eee;
    }

    /* Inputs & Buttons */
    input, select {
        width: 100%;
        padding: 10px;
        margin-top: 8px;
        margin-bottom: 15px;
        box-sizing: border-box;
        border: 1px solid #ccc;
        border-radius: 5px;
    }

    button {
        background: #0a7a3d;
        color: white;
        border: none;
        padding: 10px 15px;
        cursor: pointer;
        border-radius: 5px;
        width: 100%;
        font-size: 16px;
    }

    button:hover {
        background: #06622f;
    }

    /* Right Sticky Cart */
    .cart {
        position: fixed;
        right: 20px;
        top: 120px;
        width: 260px;
        background: white;
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0 10px 20px rgba(0,0,0,0.2);
    }

    .cart button {
        margin-top: 10px;
    }
    </style>
</head>
<body>

<div id="loginPage" class="auth-container">
    <h2>Login to QuickMart</h2>
    <input id="loginUser" placeholder="Email or Username">
    <input id="loginPass" type="password" placeholder="Password">
    <button onclick="handleLogin()">Login</button>
    <p>Don't have an account? <a href="#" onclick="showPage('registerPage')">Register here</a></p>
</div>

<div id="registerPage" class="auth-container" style="display: none;">
    <h2>Create Account</h2>
    <input id="regName" placeholder="Full Name">
    <input id="regEmail" type="email" placeholder="Email Address">
    <input id="regPass" type="password" placeholder="Password">
    
    <select id="regGender">
        <option value="">Select Gender</option>
        <option value="Male">Male</option>
        <option value="Female">Female</option>
        <option value="Other">Other</option>
    </select>
    <input id="regPhone" placeholder="Phone Number">
    
    <button onclick="handleRegister()">Register</button>
    <p>Already have an account? <a href="#" onclick="showPage('loginPage')">Login here</a></p>
</div>

<div id="storePage" class="store-layout">
    <header>
        <h1>QuickMart Convenience Store</h1>
        <p>Fast Snacks • Drinks • Everyday Essentials</p>
        <button class="logout-btn" onclick="handleLogout()">Logout</button>
    </header>

    <div class="products" id="products"></div>

    <div class="cart">
        <h3>Your Cart</h3>
        <div id="cartItems"></div>
        <hr>
        <b>Total: $<span id="total">0.00</span></b>
        <h3>Checkout</h3>
        <input id="orderName" placeholder="Full Name">
        <input id="orderEmail" placeholder="Email">
        <input id="orderAddress" placeholder="Delivery Address">
        <button id="submitBtn" onclick="placeOrder()">Place Order</button>
    </div>
</div>

<script>
// --- PAGE NAVIGATION LOGIC ---
function showPage(pageId) {
    document.getElementById('loginPage').style.display = 'none';
    document.getElementById('registerPage').style.display = 'none';
    document.getElementById('storePage').style.display = 'none';
    
    document.getElementById(pageId).style.display = 'block';
}

function handleLogin() {
    const user = document.getElementById('loginUser').value;
    const pass = document.getElementById('loginPass').value;

    if (!user || !pass) {
        alert("Please enter both fields.");
        return;
    }
    
    // Simulate Login Success
    alert("Login Successful!");
    showPage('storePage');
    
    // Pre-fill fields in checkout if available
    document.getElementById('orderName').value = document.getElementById('regName').value || "";
    document.getElementById('orderEmail').value = document.getElementById('regEmail').value || (user.includes('@') ? user : "");
}

function handleRegister() {
    const name = document.getElementById('regName').value;
    const email = document.getElementById('regEmail').value;
    const pass = document.getElementById('regPass').value;
    const gender = document.getElementById('regGender').value;
    const phone = document.getElementById('regPhone').value;

    if (!name || !email || !pass || !gender || !phone) {
        alert("Please fill in all details.");
        return;
    }

    alert("Registration Successful! Please log in.");
    showPage('loginPage');
}

function handleLogout() {
    document.getElementById('loginUser').value = "";
    document.getElementById('loginPass').value = "";
    showPage('loginPage');
}


// --- ORIGINAL STORE LOGIC ---
const products = [
    {id:1, name:"Soda Can", price: 45, image: "https://i5.walmartimages.com/seo/Coca-Cola-Soda-Pop-12-fl-oz-Can_14a1f5dc-f8bf-4071-9aea-0f753c3eecf4.08041b7f0a409ee67d80e489be3c1c55.jpeg"},
    {id:2, name:"Chocolate Bar", price: 35, image: "https://upload.wikimedia.org/wikipedia/commons/thumb/2/27/2019-01-28_19_55_14_A_Snickers_bar_with_the_wrapper_still_intact_in_the_Dulles_section_of_Sterling%2C_Loudoun_County%2C_Virginia.jpg/1920px-2019-01-28_19_55_14_A_Snickers_bar_with_the_wrapper_still_intact_in_the_Dulles_section_of_Sterling%2C_Loudoun_County%2C_Virginia.jpg"},
    {id:3, name:"Instant Noodles", price: 45, image: "https://cdn-next.cybassets.com/media/W1siZiIsIjE1NjgwL3Byb2R1Y3RzLzMxOTc4NDk1LzE2MDM3Njg1MDlfN2MzMDcxMDRjYTAzMjY4YzdlZjAuanBlZyJdLFsicCIsInRodW1iIiwiNjAweDYwMCJdXQ.jpeg?sha=b237442379719d23"},
    {id:4, name:"Ham Sandwich", price: 60, image: "https://foodpanda.dhmedia.io/image/darkstores/nv-global-catalog/tw/1e8c51eb-8bab-45db-8591-2258f7a42666.jpg?width=176&height=176"},
    {id:5, name:"Original flavor Pringles", price: 70, image: "https://b2eimg.pxec.com.tw/00176055/e8ca51b873274c3684d7bc20014df4a2.jpg"},
    {id:6, name:"Milk Tea", price: 40, image: "https://img.91app.com/webapi/imagesV3/Cropped/SalePage/6678668/0/639058587178170000?v=1"}
];

let cart = [];

function loadProducts() {
    const container = document.getElementById("products");
    container.innerHTML = ""; // Clear list
    products.forEach(p => {
        const div = document.createElement("div");
        div.className = "product";
        div.innerHTML = `
            <img src="${p.image}" class="product-img" alt="${p.name}">
            <h3>${p.name}</h3>
            <p>$${p.price.toFixed(2)}</p>
            <button onclick="addToCart(${p.id})">Add to Cart</button>
        `;
        container.appendChild(div);
    });
}

function addToCart(id) {
    const product = products.find(p => p.id === id);
    cart.push(product);
    updateCart();
}

function updateCart() {
    const cartItems = document.getElementById("cartItems");
    cartItems.innerHTML = "";
    let total = 0;
    cart.forEach(item => {
        total += item.price;
        const div = document.createElement("div");
        div.innerHTML = `${item.name} - $${item.price.toFixed(2)}`;
        cartItems.appendChild(div);
    });
    document.getElementById("total").innerText = total.toFixed(2);
}

async function placeOrder() {
    const name = document.getElementById("orderName").value;
    const email = document.getElementById("orderEmail").value;
    const address = document.getElementById("orderAddress").value;
    const btn = document.getElementById("submitBtn");

    if (!name || !email || !address || cart.length === 0) {
        alert("Please fill all fields and add items to cart.");
        return;
    }

    btn.innerText = "Sending Order...";
    btn.disabled = true;

    let orderDetails = cart.map(item => `${item.name} ($${item.price.toFixed(2)})`).join("\n");

    try {
        const response = await fetch("https://formspree.io/f/mqakprow", {
            method: "POST",
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                _replyto: email,
                Customer_Name: name,
                Customer_Email: email,
                Delivery_Address: address,
                Items: orderDetails,
                Total: "$" + document.getElementById("total").innerText
            })
        });

        if (response.ok) {
            alert("Order Success! It has been sent to phonyweng@gmail.com.");
            cart = [];
            updateCart();
            document.getElementById("orderName").value = "";
            document.getElementById("orderEmail").value = "";
            document.getElementById("orderAddress").value = "";
        } else {
            alert("Submission failed. You must open phonyweng@gmail.com and click 'Verify' on Formspree's email!");
        }
    } catch (err) {
        alert("Network error. Please try again.");
    } finally {
        btn.innerText = "Place Order";
        btn.disabled = false;
    }
}

// Start App
loadProducts();
</script>
</body>
</html>
