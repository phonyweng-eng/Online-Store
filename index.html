<!DOCTYPE html>
<html>
<head>
<title>QuickMart Convenience Store</title>

<style>
body{
font-family:Arial;
margin:0;
background:#f5f5f5;
}

header{
background:#0a7a3d;
color:white;
padding:20px;
text-align:center;
}

.products{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
gap:20px;
padding:30px;
margin-right: 300px; /* Added space so the cart doesn't overlap products */
}

.product{
background:white;
padding:20px;
border-radius:10px;
box-shadow:0 4px 10px rgba(0,0,0,0.1);
text-align:center;
}

/* --- NEW IMAGE STYLES --- */
.product-img {
width: 100%;
height: 150px;
object-fit: cover; /* Keeps image proportions nice */
border-radius: 8px;
margin-bottom: 10px;
background: #eee; /* Light gray while loading */
}

button{
background:#0a7a3d;
color:white;
border:none;
padding:10px 15px;
cursor:pointer;
border-radius:5px;
}

button:hover{
background:#06622f;
}

.cart{
position:fixed;
right:20px;
top:80px;
width:260px;
background:white;
padding:20px;
border-radius:10px;
box-shadow:0 10px 20px rgba(0,0,0,0.2);
}

input{
width:100%;
padding:8px;
margin-top:5px;
margin-bottom:10px;
}
</style>

</head>

<body>

<header>
<h1>QuickMart Convenience Store</h1>
<p>Fast Snacks • Drinks • Everyday Essentials</p>
</header>

<div class="products" id="products"></div>

<div class="cart">
<h3>Your Cart</h3>
<div id="cartItems"></div>
<hr>
<b>Total: $<span id="total">0</span></b>
<h3>Checkout</h3>
<input id="name" placeholder="Full Name">
<input id="email" placeholder="Email">
<input id="address" placeholder="Delivery Address">
<button onclick="placeOrder()">Place Order</button>
</div>

<script>
// Added 'image' property to each product
const products=[
{id:1, name:"Soda Can", price:NT 45, image: "https://i5.walmartimages.com/seo/Coca-Cola-Soda-Pop-12-fl-oz-Can_14a1f5dc-f8bf-4071-9aea-0f753c3eecf4.08041b7f0a409ee67d80e489be3c1c55.jpeg"},
{id:2, name:"Chocolate Bar", price:NT 35, image: "https://upload.wikimedia.org/wikipedia/commons/thumb/2/27/2019-01-28_19_55_14_A_Snickers_bar_with_the_wrapper_still_intact_in_the_Dulles_section_of_Sterling%2C_Loudoun_County%2C_Virginia.jpg/1920px-2019-01-28_19_55_14_A_Snickers_bar_with_the_wrapper_still_intact_in_the_Dulles_section_of_Sterling%2C_Loudoun_County%2C_Virginia.jpg"},
{id:3, name:"Instant Noodles", price:NT 45, image: "https://cdn-next.cybassets.com/media/W1siZiIsIjE1NjgwL3Byb2R1Y3RzLzMxOTc4NDk1LzE2MDM3Njg1MDlfN2MzMDcxMDRjYTAzMjY4YzdlZjAuanBlZyJdLFsicCIsInRodW1iIiwiNjAweDYwMCJdXQ.jpeg?sha=b237442379719d23"},
{id:4, name:"Ham Sandwich", price:NT 60, image: "https://foodpanda.dhmedia.io/image/darkstores/nv-global-catalog/tw/1e8c51eb-8bab-45db-8591-2258f7a42666.jpg?width=176&height=176"},
{id:5, name:"Original flavor Pringles", price:NT 70, image: "https://b2eimg.pxec.com.tw/00176055/e8ca51b873274c3684d7bc20014df4a2.jpg"},
{id:6, name:"Milk Tea", price:NT 40, image: "https://img.91app.com/webapi/imagesV3/Cropped/SalePage/6678668/0/639058587178170000?v=1"}
];

let cart=[];

function loadProducts(){
const container=document.getElementById("products");
products.forEach(p=>{
const div=document.createElement("div");
div.className="product";

// Added the <img> tag here
div.innerHTML=`
<img src="${p.image}" class="product-img" alt="${p.name}">
<h3>${p.name}</h3>
<p>$${p.price.toFixed(2)}</p>
<button onclick="addToCart(${p.id})">Add to Cart</button>
`;
container.appendChild(div);
});
}

function addToCart(id){
const product=products.find(p=>p.id===id);
cart.push(product);
updateCart();
}

function updateCart(){
const cartItems=document.getElementById("cartItems");
cartItems.innerHTML="";
let total=0;
cart.forEach(item=>{
total+=item.price;
const div=document.createElement("div");
div.innerHTML=`${item.name} - $${item.price.toFixed(2)}`;
cartItems.appendChild(div);
});
document.getElementById("total").innerText=total.toFixed(2);
}

function placeOrder(){
const name=document.getElementById("name").value;
const email=document.getElementById("email").value;
const address=document.getElementById("address").value;

if(!name || !email || !address){
alert("Please fill all fields");
return;
}

if(cart.length===0){
alert("Cart is empty");
return;
}

let orderList="";
cart.forEach(item=>{
orderList+=item.name+" - $"+item.price.toFixed(2)+"\n";
});

alert(
"Order Confirmed!\n\n"+
"Customer: "+name+"\n"+
"Email: "+email+"\n\n"+
"Items:\n"+orderList+
"\nTotal: $"+document.getElementById("total").innerText
);

cart=[];
updateCart();
}

loadProducts();
</script>

</body>
</html>
