<!DOCTYPE html>
<html>
<head>
<title>QuickMart Convenience Store</title>

<style>

body{
font-family:Arial;
margin:0;
background:#f5f5f5;
}

header{
background:#0a7a3d;
color:white;
padding:20px;
text-align:center;
}

.products{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
gap:20px;
padding:30px;
}

.product{
background:white;
padding:20px;
border-radius:10px;
box-shadow:0 4px 10px rgba(0,0,0,0.1);
text-align:center;
}

button{
background:#0a7a3d;
color:white;
border:none;
padding:10px 15px;
cursor:pointer;
border-radius:5px;
}

button:hover{
background:#06622f;
}

.cart{
position:fixed;
right:20px;
top:80px;
width:260px;
background:white;
padding:20px;
border-radius:10px;
box-shadow:0 10px 20px rgba(0,0,0,0.2);
}

input{
width:100%;
padding:8px;
margin-top:5px;
margin-bottom:10px;
}

</style>

</head>

<body>

<header>
<h1>QuickMart Convenience Store</h1>
<p>Fast Snacks • Drinks • Everyday Essentials</p>
</header>

<div class="products" id="products"></div>

<div class="cart">

<h3>Your Cart</h3>

<div id="cartItems"></div>

<hr>

<b>Total: $<span id="total">0</span></b>

<h3>Checkout</h3>

<input id="name" placeholder="Full Name">
<input id="email" placeholder="Email">
<input id="address" placeholder="Delivery Address">

<button onclick="placeOrder()">Place Order</button>

</div>

<script>

const products=[
{id:1,name:"Soda Can",price:2},
{id:2,name:"Chocolate Bar",price:1.5},
{id:3,name:"Instant Noodles",price:2.5},
{id:4,name:"Ham Sandwich",price:4},
{id:5,name:"Cookies Pack",price:3},
{id:6,name:"Hot Coffee",price:2}
];

let cart=[];

function loadProducts(){

const container=document.getElementById("products");

products.forEach(p=>{

const div=document.createElement("div");

div.className="product";

div.innerHTML=`
<h3>${p.name}</h3>
<p>$${p.price}</p>
<button onclick="addToCart(${p.id})">Add to Cart</button>
`;

container.appendChild(div);

});

}

function addToCart(id){

const product=products.find(p=>p.id===id);

cart.push(product);

updateCart();

}

function updateCart(){

const cartItems=document.getElementById("cartItems");

cartItems.innerHTML="";

let total=0;

cart.forEach(item=>{

total+=item.price;

const div=document.createElement("div");

div.innerHTML=`${item.name} - $${item.price}`;

cartItems.appendChild(div);

});

document.getElementById("total").innerText=total;

}

function placeOrder(){

const name=document.getElementById("name").value;
const email=document.getElementById("email").value;
const address=document.getElementById("address").value;

if(!name || !email || !address){
alert("Please fill all fields");
return;
}

if(cart.length===0){
alert("Cart is empty");
return;
}

let orderList="";

cart.forEach(item=>{
orderList+=item.name+" - $"+item.price+"\\n";
});

alert(
"Order Confirmed!\\n\\n"+
"Customer: "+name+"\\n"+
"Email: "+email+"\\n\\n"+
"Items:\\n"+orderList+
"\\nTotal: $"+document.getElementById("total").innerText
);

cart=[];

updateCart();

}

loadProducts();

</script>

</body>
</html>
